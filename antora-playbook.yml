site:
  title: Aplicaciones Ofimáticas · 1.º SMR
  start_page: ao::index.adoc

content:
  sources:
  - url: .
    branches: HEAD

ui:
  supplemental_files:
  - path: partials/header-content.hbs
    contents: |
      <header class="header">
        <nav class="navbar" aria-label="Navegación principal">
          <div class="navbar-brand">
            <a class="navbar-item" href="{{siteRootPath}}/ao/index.html">{{site.title}}</a>
            <button class="navbar-burger" aria-controls="topbar-nav" aria-expanded="false" aria-label="Abrir o cerrar menú">
              <span></span><span></span><span></span>
            </button>
          </div>
          <div id="topbar-nav" class="navbar-menu">
            <div class="navbar-end">
              <a class="navbar-item" href="{{siteRootPath}}/ao/index.html">Inicio</a>
              <a class="navbar-item" href="{{siteRootPath}}/ao/guia_alumnado.html">Guía del alumnado</a>
              <a class="navbar-item" href="https://aules.edu.gva.es/fp/course/view.php?id=223597">Aules</a>
            </div>
          </div>
        </nav>
      </header>
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true

output:
  dir: ./build/site
